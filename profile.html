<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – ShopSprite 365</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo_icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="/main" class="topbar__brand" aria-label="ShopSprite 365">
      <img src="assets/logo_full.png" alt="ShopSprite 365" class="topbar__logo">
    </a>
    <div class="user-menu">
      <button type="button" class="user-menu__btn" id="user-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu-list" aria-label="Account menu">
        <span class="avatar" id="topbar-avatar"></span>
      </button>
      <div class="user-menu__list" id="user-menu-list" role="menu" hidden>
        <a href="/profile" class="user-menu__item" role="menuitem">Profile</a>
        <button type="button" class="user-menu__item" role="menuitem" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main class="content" id="main" hidden>
    <div class="page">
      <h1 class="page__title">Your profile</h1>
      <section class="avatar-editor">
        <span class="avatar avatar--large" id="profile-avatar"></span>
        <div class="avatar-editor__controls">
          <div class="avatar-editor__actions">
            <button type="button" class="btn btn--ghost" id="avatar-change">Change photo</button>
            <input type="file" accept="image/*" id="avatar-input" hidden>
            <button type="button" class="btn btn--ghost" id="avatar-remove" hidden>Remove</button>
          </div>
          <p class="form-message" id="avatar-message" role="status"></p>
        </div>
      </section>
      <form class="profile-form" id="profile-form">
        <label class="form-field">
          Email
          <input type="email" name="email" readonly>
        </label>
        <label class="form-field">
          Full name
          <input type="text" name="full_name" autocomplete="name" maxlength="100">
        </label>
        <label class="form-field">
          Display name
          <input type="text" name="display_name" autocomplete="nickname" maxlength="50">
        </label>
        <label class="form-field">
          Phone
          <input type="tel" name="phone" autocomplete="tel" maxlength="30">
        </label>
        <label class="form-field">
          Postcode
          <input type="text" name="postcode" autocomplete="postal-code" maxlength="12">
        </label>
        <p class="form-message" id="profile-message" role="status"></p>
        <button type="submit" class="btn btn--primary profile-form__submit" id="profile-submit">Save</button>
      </form>
    </div>
  </main>

  <dialog class="crop-dialog" id="crop-dialog" aria-labelledby="crop-title">
    <div class="crop">
      <h2 class="crop__title" id="crop-title">Adjust your photo</h2>
      <canvas class="crop__canvas" id="crop-canvas" aria-label="Drag to position your photo"></canvas>
      <label class="crop__zoom">
        Zoom
        <input type="range" id="crop-zoom" value="1">
      </label>
      <p class="form-message" id="crop-message" role="status"></p>
      <div class="crop__actions">
        <button type="button" class="btn btn--ghost" id="crop-cancel">Cancel</button>
        <button type="button" class="btn btn--primary" id="crop-save">Save photo</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
