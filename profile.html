<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – ShopSprite 365</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo_icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="/main" class="topbar__brand" aria-label="ShopSprite 365">
      <img src="assets/logo_full.png" alt="ShopSprite 365" class="topbar__logo">
    </a>
    <div class="topbar__actions">
      <div class="menu">
        <button type="button" class="btn btn--ghost menu__btn" aria-haspopup="menu" aria-expanded="false" aria-controls="shops-menu">
          Shops
          <svg class="menu__chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="menu__list" id="shops-menu" role="menu" hidden>
          <a href="/new-list" class="menu__item" role="menuitem">New list</a>
          <a href="/lists?status=open" class="menu__item" role="menuitem">Open lists</a>
          <a href="/lists?status=completed" class="menu__item" role="menuitem">Completed lists</a>
          <a href="/lists?status=archived" class="menu__item" role="menuitem">Archived lists</a>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu__btn menu__btn--avatar" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="Account menu">
          <span class="avatar" id="topbar-avatar"></span>
        </button>
        <div class="menu__list" id="account-menu" role="menu" hidden>
          <a href="/profile" class="menu__item" role="menuitem">Profile</a>
          <button type="button" class="menu__item" role="menuitem" id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="content" id="main" hidden>
    <div class="page">
      <h1 class="page__title">Your profile</h1>
      <section class="avatar-editor">
        <span class="avatar avatar--large" id="profile-avatar"></span>
        <div class="avatar-editor__controls">
          <div class="avatar-editor__actions">
            <button type="button" class="btn btn--ghost" id="avatar-change">Change photo</button>
            <input type="file" accept="image/*" id="avatar-input" hidden>
            <button type="button" class="btn btn--ghost" id="avatar-remove" hidden>Remove</button>
          </div>
          <p class="form-message" id="avatar-message" role="status"></p>
        </div>
      </section>
      <form class="profile-form" id="profile-form">
        <label class="form-field">
          Email
          <input type="email" name="email" readonly>
        </label>
        <label class="form-field">
          Full name
          <input type="text" name="full_name" autocomplete="name" maxlength="100">
        </label>
        <label class="form-field">
          Display name
          <input type="text" name="display_name" autocomplete="nickname" maxlength="50">
        </label>
        <label class="form-field">
          Phone
          <input type="tel" name="phone" autocomplete="tel" maxlength="30">
        </label>
        <label class="form-field">
          Postcode
          <input type="text" name="postcode" autocomplete="postal-code" maxlength="12">
        </label>
        <fieldset class="market-picker">
          <legend class="market-picker__legend">Preferred supermarkets</legend>
          <p class="market-picker__hint" id="market-hint" hidden></p>
          <ol class="market-list" id="market-list" hidden></ol>
          <select class="market-picker__add" id="market-add" aria-label="Add a supermarket"></select>
        </fieldset>
        <label class="form-field">
          Delete archived lists after
          <select name="archive_retention_days">
            <option value="7">7 days</option>
            <option value="30">30 days</option>
            <option value="90">90 days</option>
            <option value="180">6 months</option>
            <option value="365">1 year</option>
            <option value="never">Never</option>
          </select>
        </label>
        <p class="form-message" id="profile-message" role="status"></p>
        <button type="submit" class="btn btn--primary profile-form__submit" id="profile-submit">Save</button>
      </form>
    </div>
  </main>

  <dialog class="crop-dialog" id="crop-dialog" aria-labelledby="crop-title">
    <div class="crop">
      <h2 class="crop__title" id="crop-title">Adjust your photo</h2>
      <canvas class="crop__canvas" id="crop-canvas" aria-label="Drag to position your photo"></canvas>
      <label class="crop__zoom">
        Zoom
        <input type="range" id="crop-zoom" value="1">
      </label>
      <p class="form-message" id="crop-message" role="status"></p>
      <div class="crop__actions">
        <button type="button" class="btn btn--ghost" id="crop-cancel">Cancel</button>
        <button type="button" class="btn btn--primary" id="crop-save">Save photo</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
