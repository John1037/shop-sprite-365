<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSprite 365</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo_icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home">
  <header class="topbar">
    <a href="/" class="topbar__brand" aria-label="ShopSprite 365 home">
      <img src="assets/logo_full.png" alt="ShopSprite 365" class="topbar__logo">
    </a>
    <nav class="topbar__actions">
      <button type="button" class="btn btn--ghost" id="login-btn">Log in</button>
      <button type="button" class="btn btn--primary" id="signup-btn">Sign up</button>
    </nav>
  </header>

  <main class="content" id="main">
    <!-- Home page content goes here -->
  </main>

  <dialog class="auth-dialog" id="auth-dialog">
    <form class="auth-form" id="auth-form">
      <button type="button" class="auth-dialog__close" id="auth-close" aria-label="Close">&times;</button>
      <h2 class="auth-form__title" id="auth-title">Log in</h2>
      <label class="auth-form__field">
        Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="auth-form__field">
        Password
        <input type="password" name="password" autocomplete="current-password" minlength="6" required>
      </label>
      <p class="auth-form__message" id="auth-message" role="status"></p>
      <button type="submit" class="btn btn--primary auth-form__submit" id="auth-submit">Log in</button>
      <p class="auth-form__switch">
        <span id="auth-switch-text">No account yet?</span>
        <button type="button" class="link-btn" id="auth-switch">Sign up</button>
      </p>
    </form>
  </dialog>

  <script type="module" src="js/home.js"></script>
</body>
</html>
